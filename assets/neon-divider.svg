<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="46" viewBox="0 0 1200 46" role="img" aria-label="Animated cyan and violet divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset=".25" stop-color="#818cf8"/>
      <stop offset=".55" stop-color="#22d3ee"/>
      <stop offset=".85" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <path d="M0 23H1200" stroke="url(#g)" stroke-width="5" opacity=".45" filter="url(#blur)"/>
  <path d="M0 23H1200" stroke="url(#g)" stroke-width="1.5"/>
  <path d="M0 23H180" stroke="#a5f3fc" stroke-width="3">
    <animate attributeName="d" values="M0 23H80;M0 23H1200;M0 23H80" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".3;1;.3" dur="5s" repeatCount="indefinite"/>
  </path>
  <circle cx="180" cy="23" r="3" fill="#67e8f9">
    <animate attributeName="cx" values="0;1200;0" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>