  <rect x="30" y="88" width="425" height="373" rx="13" fill="#070b11" fill-opacity=".72" stroke="#26364a"/>
  <text x="52" y="120" fill="#67e8f9" font-size="13" font-weight="700" letter-spacing="2" font-family="Consolas, Menlo, monospace">ASCII / DEVELOPER MODE</text>

