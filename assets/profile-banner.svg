<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Manideep | Backend Engineering and Applied AI</title>
  <desc id="desc">An animated dark navy and cyan developer banner featuring a person seated at a desk, typing on a computer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#171447"/>
      <stop offset="100%" stop-color="#06394a"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17314b"/>
      <stop offset="100%" stop-color="#0b1729"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102d43"/>
      <stop offset="100%" stop-color="#11132f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <path d="M620 0V360" stroke="#94a3b8" stroke-opacity=".08"/>
  <circle cx="990" cy="155" r="250" fill="url(#glow)">
    <animate attributeName="r" values="215;265;215" dur="8s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="url(#line)" stroke-width="2" opacity=".65">
    <path d="M650 38H790L830 78H1110"><animate attributeName="stroke-dasharray" values="0 700;220 700;0 700" dur="7s" repeatCount="indefinite"/></path>
    <path d="M700 320H845L885 280H1145"><animate attributeName="stroke-dasharray" values="0 700;260 700;0 700" dur="8s" repeatCount="indefinite"/></path>
  </g>

  <!-- Person seated at a desk -->
  <g transform="translate(0 0)">
    <!-- chair -->
    <path d="M782 177Q770 163 774 142Q778 119 803 118H841Q856 120 855 139V226H816Q790 222 782 203Z"
          fill="#111b31" stroke="#6476a8" stroke-width="3"/>
    <path d="M797 221L790 293M840 224L851 293" stroke="#6476a8" stroke-width="5" stroke-linecap="round"/>
    <path d="M773 294H865" stroke="#6476a8" stroke-width="5" stroke-linecap="round"/>

    <!-- legs, seated -->
    <path d="M825 226Q852 243 891 253L922 306Q926 317 915 322H887L849 274L813 269Z"
          fill="#27365d" stroke="#6b7cb3" stroke-width="2.5"/>
    <path d="M866 264L844 310Q839 324 851 329H884L905 292"
          fill="#1b2850" stroke="#6b7cb3" stroke-width="2.5"/>
    <path d="M850 329H894" stroke="#67e8f9" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>

    <!-- torso / hoodie -->
    <path d="M815 175Q832 161 853 171Q878 181 891 207L903 250Q880 266 842 258L808 234Q804 205 815 175Z"
          fill="#26345e" stroke="#8191c8" stroke-width="2.5"/>
    <path d="M819 184Q833 174 849 181L865 201" fill="none" stroke="#a5b4fc" stroke-opacity=".65" stroke-width="2"/>
    <path d="M846 187L855 235" stroke="#a5b4fc" stroke-opacity=".28" stroke-width="2"/>

    <!-- head, hair and face -->
    <path d="M815 133Q817 99 848 96Q877 96 884 124L878 159Q870 177 850 178Q829 173 818 154Z"
          fill="#d79b78" stroke="#f0bd99" stroke-width="2"/>
    <path d="M813 137Q805 117 818 102Q833 82 858 90Q881 92 886 116L880 132Q868 117 855 116Q837 119 825 135L820 151Z"
          fill="#182037" stroke="#53658e" stroke-width="2"/>
    <path d="M840 145Q845 148 850 145" fill="none" stroke="#754b48" stroke-width="2" stroke-linecap="round"/>
    <circle cx="841" cy="135" r="2.2" fill="#20283b"/>
    <circle cx="861" cy="135" r="2.2" fill="#20283b"/>

    <!-- typing arms and hands -->
    <path d="M876 198Q899 207 922 224L948 241" fill="none" stroke="#d79b78" stroke-width="13" stroke-linecap="round"/>
    <path d="M817 205Q839 218 866 226L909 241" fill="none" stroke="#d79b78" stroke-width="12" stroke-linecap="round"/>
    <path d="M872 199L887 213" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- desk and computer -->
  <g>
    <path d="M756 250H1162L1142 273H764Z" fill="url(#desk)" stroke="#67e8f9" stroke-opacity=".62" stroke-width="2"/>
    <path d="M785 274L779 327M1128 273L1136 327" stroke="#35516f" stroke-width="7" stroke-linecap="round"/>
    <rect x="934" y="101" width="178" height="126" rx="11" fill="#080d1a" stroke="#7dd3fc" stroke-opacity=".75" stroke-width="2.5"/>
    <rect x="944" y="111" width="158" height="105" rx="5" fill="url(#screen)"/>
    <circle cx="1023" cy="106" r="2" fill="#67e8f9"/>
    <g stroke-linecap="round">
      <path d="M960 130H1012M960 143H1082M960 156H1044M976 169H1080M976 182H1035M960 195H1062"
            stroke="#67e8f9" stroke-width="3" opacity=".78"/>
      <path d="M960 130H980M1018 143H1060M1049 156H1080M1039 182H1082"
            stroke="#a78bfa" stroke-width="3" opacity=".85"/>
    </g>
    <path d="M1023 228V248M995 250H1051" stroke="#8ba4c7" stroke-width="5" stroke-linecap="round"/>
    <path d="M914 248L1008 248L1030 260H897Z" fill="#111d32" stroke="#67e8f9" stroke-opacity=".55" stroke-width="1.5"/>
    <g stroke="#7dd3fc" stroke-opacity=".65" stroke-width="1.2">
      <path d="M922 251H1005M919 255H1013M928 259H1020"/>
      <path d="M938 249L932 259M951 249L946 260M964 249L961 260M977 249L976 260M990 249L991 260"/>
    </g>
    <path d="M1066 250Q1081 232 1094 250L1094 257H1066Z" fill="#24385a" stroke="#818cf8" stroke-width="1.5"/>
    <path d="M1080 232V217" stroke="#818cf8" stroke-width="2"/>
    <path d="M1080 217Q1063 204 1054 219Q1066 228 1080 217Q1097 203 1106 218Q1094 229 1080 217Z" fill="#818cf8" fill-opacity=".6"/>
  </g>

  <!-- left-side identity -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#f8fafc">
    <text x="70" y="93" font-size="16" letter-spacing="5" fill="#67e8f9">CSE • DATA SCIENCE</text>
    <text x="66" y="163" font-size="66" font-weight="800" letter-spacing="-2">MANIDEEP</text>
    <text x="70" y="204" font-size="21" fill="#cbd5e1">Backend Engineering  /  Applied AI  /  Data Systems</text>
    <text x="70" y="252" font-family="monospace" font-size="15" fill="#a5b4fc">Java · Spring Boot · SQL · Python · RAG</text>
  </g>
  <path d="M70 285H610" stroke="#67e8f9" stroke-opacity=".65" stroke-width="2"/>
  <path d="M70 285H170" stroke="#67e8f9" stroke-width="3">
    <animate attributeName="x2" values="120;610;120" dur="6s" repeatCount="indefinite"/>
  </path>
  <text x="70" y="321" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2" fill="#94a3b8">LEARN DEEPLY. BUILD DELIBERATELY.</text>
  <text x="950" y="338" text-anchor="middle" font-family="monospace" font-size="10" fill="#7dd3fc" opacity=".8">BUILD MODE: ACTIVE</text>
</svg>