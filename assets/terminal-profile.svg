<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">D. Manideep — Terminal Portfolio</title>
  <desc id="desc">A dark terminal-inspired portfolio card with original ASCII robot art and a developer profile panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="55%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#101326"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#8b5cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".18"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94a3b8" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="1184" height="484" rx="22" fill="url(#bg)" stroke="#263348" stroke-width="2"/>
  <rect x="9" y="9" width="1182" height="482" rx="21" fill="url(#grid)"/>
  <path d="M10 66H1190" stroke="#29364b" stroke-width="1"/>
